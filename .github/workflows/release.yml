name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The tag matches the package version
        run: test -f "dist/verbatim_relay-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - name: The tag matches the plugin version
        run: |
          grep -q "\"version\": \"${GITHUB_REF_NAME#v}\"" plugins/claude-code/.claude-plugin/plugin.json
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: The wheel that will be published passes every test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl pytest
          /tmp/clean/bin/verbatim-relay --version
          /tmp/clean/bin/python -m pytest -p no:cacheprovider tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes are the version's CHANGELOG section
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " { if (on) exit; on = index($0, "## " v) == 1; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
