name: CI

on:
  # A PR does not have to be up to date with main before it merges (#308). Thus each job of
  # this file, with the full test matrix, runs on main after each merge. Do not add a job
  # condition that stops a job on main. If a job fails on main, fix it before the next merge.
  push:
    branches: [main]
  pull_request:

jobs:
  # The jobs lint and test only read the repo. Thus each has no token that can write, and its
  # checkout keeps no token on disk (#438).
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the stealth gate reads every commit message
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Conformance cases are up to date
        run: uv run python conformance/build.py && git diff --exit-code conformance/
      - name: No banned term in files, paths or commit messages
        run: uv run python scripts/stealth.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        # GitHub has few macOS runners. Ubuntu covers each Python version, and macOS covers the
        # oldest and the newest. macOS found defects that Ubuntu did not (#17).
        exclude:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --python ${{ matrix.python }}
      # The 15 slowest tests show in the log of each job, so a slow test is easy to find (#17).
      - run: uv run pytest --cov --cov-report=term-missing --durations=15

  # This job runs the code of the npm package. Thus it has no token that can write, and the
  # checkout keeps no token on disk.
  claude-code-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tested Claude Code version
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - run: claude plugin validate plugins/nookku
      - run: claude plugin test plugins/nookku
