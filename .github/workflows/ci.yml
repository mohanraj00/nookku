name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the stealth gate reads every commit message
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Conformance cases are up to date
        run: uv run python conformance/build.py && git diff --exit-code conformance/
      - name: No banned term in files, paths or commit messages
        run: uv run python scripts/stealth.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        # GitHub has few macOS runners. Ubuntu covers each Python version, and macOS covers the
        # oldest and the newest. macOS found defects that Ubuntu did not (#17).
        exclude:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing

  claude-code-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the tested Claude Code version
        run: npm install -g @anthropic-ai/claude-code@2.1.290
      - run: claude plugin validate plugins/nookku
      - run: claude plugin test plugins/nookku
