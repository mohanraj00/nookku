name: Claude Code release check

# The plugin uses function hooks, which are early access and can change between releases.
# ci.yml pins the tested Claude Code version. This workflow runs the plugin checks of ci.yml on
# the latest release each day. If a check fails, it opens one issue for that version (#3).
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # This job runs the code of the npm package. Thus it has no token that can write.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.latest.outputs.version }}
      validate: ${{ steps.validate.outcome }}
      test: ${{ steps.test.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the latest Claude Code version
        id: latest
        run: |
          version="$(npm view @anthropic-ai/claude-code version)"
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "npm gave a version that is not X.Y.Z: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the latest Claude Code
        id: install
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: npm install -g "@anthropic-ai/claude-code@$VERSION"
      - name: Validate the plugin
        id: validate
        # A step timeout fails the step. A job timeout cancels the job, and then the report job
        # does not run. Thus each step stops well before the job timeout of 20 minutes.
        timeout-minutes: 5
        run: |
          set -o pipefail
          claude plugin validate plugins/nookku 2>&1 | tee -a check.log
      - name: Test the plugin
        id: test
        timeout-minutes: 5
        # Also run the tests if the validation fails, so that the issue gives both results.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          claude plugin test plugins/nookku 2>&1 | tee -a check.log
      - name: Keep the log for the issue
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-log
          path: check.log
          if-no-files-found: ignore
          retention-days: 7

  # This job runs no code of the npm package. It reads the log only as text.
  # It opens an issue only if a plugin check failed. A failed install gives a failed run and
  # no issue, so that a later run can still open the issue of that version.
  report:
    needs: check
    if: >-
      ${{ failure() && needs.check.outputs.version != '' &&
      (needs.check.outputs.validate == 'failure' || needs.check.outputs.test == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: check-log
      - name: Open an issue for the failed version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          VALIDATE: ${{ needs.check.outputs.validate }}
          TEST: ${{ needs.check.outputs.test }}
          PIN: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/ci.yml
          PROOFS: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/contributing/run-the-proofs.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Claude Code $VERSION fails the plugin checks"
          # One issue for each version, also if a person closed it.
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' \
              | grep -Fqx "$title"; then
            echo "An issue for Claude Code $VERSION exists. I do not open a new one."
            exit 0
          fi
          touch check.log
          {
            echo "The scheduled check ran the plugin checks with Claude Code $VERSION. A check failed."
            echo
            echo "- \`claude plugin validate plugins/nookku\`: $VALIDATE"
            echo "- \`claude plugin test plugins/nookku\`: $TEST"
            echo "- Run: $RUN_URL"
            echo "- The CI pin: [ci.yml]($PIN)"
            echo
            echo "Do not change the CI pin to $VERSION before you do these steps:"
            echo
            echo "1. Fix the plugin, or report the defect to Claude Code."
            echo "2. Run the proofs P1 to P5 again with Claude Code $VERSION, as [run-the-proofs.md]($PROOFS) says. They need a model, so they are local."
            echo "3. Commit the results with the version that they record."
            echo
            echo "The last 200 lines of the log:"
            echo
            # Each log line has 4 spaces before it, so that no line of the log can close the fence.
            echo "~~~~~~~~~~"
            tail -n 200 check.log | cut -c 1-300 | sed 's/^/    /'
            echo "~~~~~~~~~~"
          } > issue.md
          gh issue create --title "$title" --label bug --body-file issue.md
