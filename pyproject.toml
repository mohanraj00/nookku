[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "nooku"
dynamic = ["version", "readme"]
description = "A test harness for developers of agent apps. Test your agent through Claude Code or Codex, byte for byte, and audit the record."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohan Raj" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
keywords = ["llm", "agents", "testing", "claude-code", "codex", "audit"]

[project.scripts]
nooku = "nooku.cli:main"

[project.urls]
Repository = "https://github.com/mohanraj00/verbatim-relay"
Documentation = "https://github.com/mohanraj00/verbatim-relay/blob/main/docs/index.md"
Specification = "https://github.com/mohanraj00/verbatim-relay/blob/main/SPEC.md"
Changelog = "https://github.com/mohanraj00/verbatim-relay/blob/main/CHANGELOG.md"
Issues = "https://github.com/mohanraj00/verbatim-relay/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.version]
path = "src/nooku/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nooku"]

[tool.hatch.build.targets.sdist]
# the package, its spec and its conformance suite; the benchmark and proofs stay in the repo
include = ["/src", "/tests", "/conformance", "/SPEC.md", "/CHANGELOG.md", "/README.md", "/LICENSE"]

# PyPI renders the README without the repo around it, so relative links point at GitHub
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/mohanraj00/verbatim-relay/blob/main/\1)'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"conformance/build.py" = ["E501"]  # case texts read better unwrapped
"bench/sessions.py" = ["E501"]  # the same, for the scripted messages and replies

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["nooku"]
branch = true
