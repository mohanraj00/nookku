<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nookku chat</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="render.css">
<link rel="stylesheet" href="trace.css">
<script src="render.js" defer></script>
<script src="app.js" defer></script>
<script src="save.js" defer></script>
<link rel="stylesheet" href="notes.css">
<script src="notes.js" defer></script>
<script src="export_button.js" defer></script>
<script src="trace.js" defer></script>
<script src="keys.js" defer></script>
<link rel="stylesheet" href="keys.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
  <h1>Nookku chat</h1>
  <p id="test">No test yet.</p>
  <p class="save"><button id="save-script" type="button">Save as script</button> <span id="save-result" role="status"></span></p>
  <p class="save"><button id="export" type="button">Export</button> <span id="export-result" role="status"></span></p>
  <p class="nav"><a href="dashboard.html">All tests</a></p>
</header>
<main>
  <p id="start" class="mark" hidden></p>
  <ol id="turns"></ol>
  <p id="end" class="mark" hidden></p>
</main>
<footer>
  <p id="error" role="alert" hidden></p>
  <label for="said">Message to the agent</label>
  <div class="send">
    <textarea id="said" rows="3" autocomplete="off"></textarea>
    <button id="send" type="button">Send</button>
  </div>
  <p class="note">Nookku sends each message byte for byte. The harness model does not see it.</p>
</footer>
</body>
</html>
